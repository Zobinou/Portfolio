allowBuilds:
  sharp: false
  unrs-resolver: false
permissions:
  '@prisma/engines':
    build: true
  esbuild:
    build: true
  prisma:
    build: true
    skills: true
skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
